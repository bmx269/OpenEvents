name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: npm ci
      - run: npm run build
      - run: npm run lint:js
      - name: PHP syntax
        run: find inc src templates dev tests *.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wp: ['7.1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          tools: composer
          coverage: none
      - run: npm ci && npm run build
      - run: composer install --no-interaction --no-progress
      - name: Cache WordPress test environment
        uses: actions/cache@v4
        with:
          path: .wp-tests
          key: wp-tests-${{ matrix.wp }}-${{ hashFiles('bin/install-wp-tests.sh') }}
      - run: bash bin/install-wp-tests.sh
        env:
          WP_VERSION: ${{ matrix.wp }}
      - run: vendor/bin/phpunit

  e2e:
    name: End-to-end (Playwright + Playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
