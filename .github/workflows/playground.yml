name: Playground build

# Publishes the demo zip used by the "Try it in WordPress Playground" link
# (.wordpress-org/blueprints/blueprint.json) to the `playground` branch.
# The branch is a single force-pushed commit, so it never grows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playground
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: bash bin/build-zip.sh playground
      - name: Push to the playground branch
        run: |
          mkdir publish && cp dist/openevents.zip publish/
          cd publish
          printf '# Playground build\n\nBuilt from %s by CI for the Playground demo. Not for development.\n' "$GITHUB_SHA" > README.md
          git init -q -b playground
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Playground build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" playground
